<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ตั๋วกาแฟ Café Amazon | ประชุม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    /* ---- token system: "coffee order ticket / counter queue" ---- */
    --ink:#231a12;
    --forest:#0F3626;
    --forest-2:#1E6046;
    --forest-tint:#E7EFE8;
    --parchment:#F7F1E2;
    --paper-2:#EFE6D0;
    --amber:#C1852E;
    --amber-soft:#F3E0B8;
    --rust:#9C4426;
    --line-dash:#C8B589;
    --white:#ffffff;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow-glass:0 10px 34px rgba(15,54,38,0.16);
    --ease-ios:cubic-bezier(.36,.66,.04,1);
    --header-h:78px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Thai','Prompt',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(30,96,70,0.10), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(193,133,46,0.10), transparent 40%),
      #E3DEC8;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Prompt',sans-serif;}
  .num{font-family:'IBM Plex Mono',monospace;}

  /* perforation motif — signature element reused across cards/tickets */
  .perf-edge{
    height:12px;
    background:radial-gradient(circle at 7px 0, transparent 6px, var(--forest) 6px) top/14px 12px repeat-x;
  }
  .perf-edge.light{
    background:radial-gradient(circle at 7px 0, transparent 6px, var(--parchment) 6px) top/14px 12px repeat-x;
  }

  /* ================= APP SHELL ================= */
  #app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    background:var(--parchment);
    position:relative;
    box-shadow:var(--shadow-glass);
    display:flex;
    flex-direction:column;
  }
  @media(min-width:560px) and (max-width:1023px){
    body{padding:28px 12px;}
    #app{min-height:calc(100vh - 56px); border-radius:var(--radius-lg); overflow:hidden;}
  }

  /* ---------- Header (counter signage) ---------- */
  .appbar{
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 26px),
      linear-gradient(135deg,var(--forest),var(--forest-2) 78%);
    color:#fff;
    padding:calc(16px + env(safe-area-inset-top)) 18px 16px;
    position:sticky; top:0; z-index:30;
  }
  .appbar-row{display:flex; align-items:center; gap:12px;}
  .appbar-avatar{
    width:44px;height:44px;border-radius:50%;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-size:21px; flex-shrink:0;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.45), 0 4px 10px rgba(0,0,0,0.18);
  }
  .appbar-title{font-weight:700; font-size:17.5px; line-height:1.2; letter-spacing:.2px;}
  .appbar-sub{font-size:11.5px; opacity:0.82; margin-top:2px; letter-spacing:.3px;}
  .appbar-date{
    margin-left:auto; font-size:11px; background:rgba(255,255,255,0.15);
    padding:6px 11px; border-radius:100px; white-space:nowrap;
    font-family:'IBM Plex Mono',monospace; border:1px solid rgba(255,255,255,0.18);
  }

  /* ---------- Category bar — "order counter" queue tabs, always floats ---------- */
  .chips{
    display:flex; gap:6px; overflow-x:auto; padding:10px; margin:0 14px;
    background:rgba(239,230,208,0.86);
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
    border-radius:100px;
    position:sticky; top:var(--header-h); z-index:20;
    scrollbar-width:none;
    border:1px solid rgba(200,181,137,0.55);
    box-shadow:0 6px 16px rgba(15,54,38,0.08);
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:8px 15px; border-radius:100px; font-size:12.5px;
    background:transparent; border:none; color:var(--forest);
    font-weight:600; cursor:pointer; transition:.22s var(--ease-ios);
    display:flex; align-items:center; gap:6px; opacity:0.62;
  }
  .chip.active{background:var(--forest); color:#fff; opacity:1; box-shadow:0 3px 10px rgba(15,54,38,0.32);}

  .chips-spacer{height:14px;}

  /* ---------- Views ---------- */
  .view{display:none; padding:0 14px 14px; padding-bottom:calc(64px + 56px); flex:1;}
  .view.active{display:block;}

  .cat-heading{
    font-size:13.5px; font-weight:700; color:var(--forest); margin:20px 4px 10px;
    scroll-margin-top:150px; display:flex; align-items:center; gap:8px;
  }
  .cat-heading::after{content:""; flex:1; height:1px; background:repeating-linear-gradient(90deg, var(--line-dash) 0 5px, transparent 5px 10px);}
  .cat-heading:first-child{margin-top:16px;}

  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .menu-card{
    background:var(--white);
    border:1px solid rgba(200,181,137,0.45);
    border-radius:var(--radius-md);
    padding:13px 12px 11px;
    box-shadow:0 4px 14px rgba(35,26,18,0.06);
    display:flex; flex-direction:column; gap:6px;
    cursor:pointer; transition:transform .18s var(--ease-ios), box-shadow .18s var(--ease-ios), border-color .18s;
    position:relative; overflow:hidden;
  }
  .menu-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg,var(--amber),var(--forest-2));
    opacity:0; transition:opacity .2s var(--ease-ios);
  }
  .menu-card:hover{box-shadow:0 10px 22px rgba(35,26,18,0.12); transform:translateY(-2px); border-color:var(--amber);}
  .menu-card:hover::before{opacity:1;}
  .menu-card:active{transform:scale(0.96);}
  .menu-icon{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center; font-size:20px;
    background:var(--forest-tint);
    box-shadow:inset 0 0 0 1px rgba(15,54,38,0.08);
  }
  .menu-icon.cold{background:#E3EEF2;}
  .menu-icon.blend{background:var(--amber-soft);}
  .menu-name{font-size:13.5px; font-weight:600; line-height:1.3;}
  .menu-price{font-size:12.5px; color:var(--forest-2); font-weight:600;}
  .menu-add{
    margin-top:auto; align-self:flex-end;
    font-size:11.5px; color:var(--amber); font-weight:700;
    display:flex; align-items:center; gap:3px;
  }

  /* ---------- Cart panel heading (chat replaced with "order tickets") ---------- */
  .cartpanel-heading{
    display:flex; align-items:center; justify-content:space-between;
    margin:16px 4px 10px;
  }
  .cartpanel-heading h3{font-size:14.5px; margin:0; color:var(--forest); font-weight:700;}
  .cartpanel-heading span{font-size:11px; color:#8a7c65;}

  .chatlog{margin-bottom:14px; display:flex; flex-direction:column; gap:8px;}
  .chatlog-empty{
    text-align:center; color:#8a7c65; font-size:12.5px;
    padding:20px 12px; background:rgba(255,255,255,0.6); border:1px dashed var(--line-dash);
    border-radius:var(--radius-md);
  }
  .bubble-row{display:flex; flex-direction:column; align-items:flex-start;}
  .bubble{
    background:var(--white); color:var(--ink); padding:9px 13px 9px 12px;
    border-radius:4px var(--radius-sm) var(--radius-sm) var(--radius-sm);
    font-size:12.8px; max-width:92%; line-height:1.5;
    border-left:3px solid var(--amber);
    box-shadow:0 2px 8px rgba(35,26,18,0.06);
  }
  .bubble b{font-weight:700; color:var(--forest);}
  .bubble-time{font-size:10px; color:#a3937a; margin-top:3px; margin-left:2px; font-family:'IBM Plex Mono',monospace;}

  /* ---------- Cart items — ticket stub shape ---------- */
  .cart-item{
    display:flex; gap:10px; align-items:center; background:#fff; border-radius:var(--radius-md);
    padding:10px 12px; margin-bottom:8px; border:1px solid var(--paper-2);
    position:relative;
  }
  .cart-item::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:repeating-linear-gradient(180deg, var(--forest-2) 0 5px, transparent 5px 10px);
    border-radius:3px 0 0 3px;
  }
  .cart-item .ci-icon{width:34px;height:34px;border-radius:50%;background:var(--forest-tint);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .cart-item .ci-info{flex:1; min-width:0;}
  .ci-name{font-size:13px; font-weight:600;}
  .ci-meta{font-size:11.5px; color:#8a7c65; margin-top:2px;}
  .ci-price{font-size:13px; font-weight:600; color:var(--forest-2); flex-shrink:0; font-family:'IBM Plex Mono',monospace;}
  .ci-del{
    background:none; border:none; color:var(--rust); font-size:17px; cursor:pointer; padding:4px 6px; flex-shrink:0;
    border-radius:50%; transition:background .15s;
  }
  .ci-del:hover{background:rgba(156,68,38,0.1);}
  .cart-empty{text-align:center; padding:40px 20px; color:#8a7c65;}
  .cart-empty .big{font-size:34px; margin-bottom:8px;}

  .cart-summary-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; margin-top:6px; border-top:1px dashed var(--line-dash); font-weight:700;
  }
  .cart-summary-bar .num{color:var(--forest); font-size:15px;}

  .btn{
    display:block; width:100%; text-align:center; border:none; border-radius:100px;
    padding:14px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:'Prompt',sans-serif;
    transition:transform .15s var(--ease-ios), opacity .15s var(--ease-ios), box-shadow .15s;
    letter-spacing:.2px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--forest); color:#fff; box-shadow:0 6px 16px rgba(15,54,38,0.28);}
  .btn-primary:disabled{background:#b7b09b; cursor:not-allowed; box-shadow:none;}
  .btn-secondary{background:var(--amber-soft); color:var(--ink);}
  .btn-outline{background:#fff; color:var(--forest); border:1.5px solid var(--forest);}

  /* ---------- Summary / receipt ---------- */
  .subtabs{display:flex; gap:8px; margin:16px 0 14px;}
  .subtab{flex:1; text-align:center; padding:9px; border-radius:100px; font-size:12.5px; font-weight:700; background:#fff; border:1px solid var(--paper-2); cursor:pointer; color:#8a7c65; transition:.2s var(--ease-ios);}
  .subtab.active{background:var(--forest); color:#fff; border-color:var(--forest);}

  .receipt-wrap{background:transparent; padding:6px 0 18px;}
  .receipt{
    background:#fffdf6; border-radius:14px; position:relative; overflow:hidden;
    box-shadow:0 14px 32px rgba(35,26,18,0.16);
  }
  .receipt-top{
    background:linear-gradient(135deg,var(--forest),var(--forest-2) 80%);
    color:#fff; padding:18px 20px 14px; position:relative;
  }
  .receipt-top h3{margin:0; font-size:16px; font-family:'Prompt',sans-serif;}
  .receipt-top .sub{font-size:11.5px; opacity:0.82; margin-top:4px; font-family:'IBM Plex Mono',monospace;}
  .receipt-body{padding:6px 20px 4px;}
  .receipt-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed #e2d5b0; font-size:13px;}
  .receipt-row:last-child{border-bottom:none;}
  .rr-left{flex:1;}
  .rr-name{font-weight:600;}
  .rr-meta{font-size:11px; color:#8a7c65; margin-top:2px;}
  .rr-price{font-weight:700; white-space:nowrap; font-family:'IBM Plex Mono',monospace; color:var(--forest-2);}
  .receipt-total{
    display:flex; justify-content:space-between; padding:14px 20px 18px; font-weight:700; font-size:15px;
    background:var(--amber-soft); margin-top:6px; font-family:'Prompt',sans-serif;
  }
  .receipt-total .num{font-family:'IBM Plex Mono',monospace;}
  .receipt-foot{text-align:center; font-size:10.5px; color:#a3937a; padding:10px 0 16px;}

  .empty-state{text-align:center; padding:50px 20px; color:#8a7c65;}
  .empty-state .big{font-size:36px; margin-bottom:10px;}
  .empty-state .t{font-weight:700; color:var(--ink); margin-bottom:4px; font-size:14px; font-family:'Prompt',sans-serif;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:calc(100% - 32px); max-width:460px;
    display:flex; gap:2px; padding:6px; z-index:40;
    background:rgba(247,241,226,0.82);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:22px;
    box-shadow:0 12px 30px rgba(15,54,38,0.22), 0 2px 8px rgba(0,0,0,0.06);
  }
  .navbtn{
    flex:1; text-align:center; padding:9px 4px 7px; background:none; border:none; cursor:pointer;
    color:#8a7c65; font-family:'Prompt',sans-serif; position:relative;
    border-radius:16px; transition:background .22s var(--ease-ios), color .22s var(--ease-ios);
  }
  .navbtn .icon{font-size:18px; display:block;}
  .navbtn .lbl{font-size:10.5px; margin-top:2px; font-weight:600;}
  .navbtn.active{color:var(--white); background:var(--forest);}
  .navbadge{
    position:absolute; top:2px; right:calc(50% - 22px); background:var(--rust); color:#fff;
    font-size:9.5px; min-width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 3px;
    font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,20,15,0.5); z-index:100;
    backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-backdrop.open{display:flex;}
  .modal-sheet{
    background:#fff; width:100%; max-width:480px; border-radius:22px 22px 0 0;
    padding:20px 20px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
    animation:slideup .28s var(--ease-ios);
  }
  @keyframes slideup{from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .modal-icon{width:48px;height:48px;border-radius:50%;background:var(--forest-tint);display:flex;align-items:center;justify-content:center;font-size:24px;}
  .modal-title{font-size:16px; font-weight:700; font-family:'Prompt',sans-serif;}
  .modal-price{font-size:13px; color:var(--forest-2); font-weight:600; margin-top:2px; font-family:'IBM Plex Mono',monospace;}
  .field-label{font-size:12.5px; font-weight:700; margin:14px 0 6px; color:var(--ink);}
  .field-input{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--paper-2);
    font-size:14px; font-family:inherit; background:#fbf7ec;
  }
  .field-input:focus{outline:none; border-color:var(--forest-2);}
  .opt-row{display:flex; gap:8px; flex-wrap:wrap;}
  .opt-pill{
    padding:8px 14px; border-radius:100px; border:1.5px solid var(--paper-2); background:#fff;
    font-size:12.5px; cursor:pointer; color:#8a7c65; font-weight:600; transition:.2s var(--ease-ios);
  }
  .opt-pill.sel{background:var(--forest); border-color:var(--forest); color:#fff;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}

  .toast{
    position:fixed; bottom:calc(64px + 42px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:100px;
    font-size:12.5px; z-index:200; opacity:0; pointer-events:none; transition:.28s var(--ease-ios);
    white-space:nowrap;
  }
  .toast.show{opacity:1; bottom:calc(64px + 52px + env(safe-area-inset-bottom));}

  .save-btn-row{display:flex; gap:10px; padding:0 0 14px;}

  ::-webkit-scrollbar{width:0; height:0;}

  /* ================= DESKTOP WEBAPP LAYOUT ================= */
  @media(min-width:1024px){
    body{padding:32px 20px;}
    #app{
      max-width:1160px;
      height:100vh;
      overflow-y:auto;
      overflow-x:hidden;
      display:grid;
      grid-template-columns:1fr 390px;
      grid-template-rows:auto auto 1fr;
      border-radius:var(--radius-lg);
      box-shadow:0 26px 64px rgba(15,54,38,0.2);
    }
    .appbar{grid-column:1/3; grid-row:1; padding:20px 28px 16px; border-radius:var(--radius-lg) var(--radius-lg) 0 0;}
    .appbar-title{font-size:19px;}

    .view{grid-column:1; grid-row:3; padding:26px 28px 40px; border-radius:0 0 0 var(--radius-lg);}
    .menu-grid{grid-template-columns:repeat(3,1fr); gap:16px;}
    .chips{position:sticky; top:var(--header-h); margin:0 0 4px;}

    #view-cart{
  display:flex !important; flex-direction:column;
  grid-column:2; grid-row:2/4;              /* ⬅️ เปลี่ยนจาก 1/4 เป็น 2/4 */
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  background:#fff;
  border-left:1px solid var(--paper-2);
  position:sticky; top:0; align-self:start;  /* ⬅️ top:0 ได้แล้ว เพราะไม่ได้อยู่แถว 1 อีกต่อไป */
  height:calc(100vh - var(--header-h));       /* ⬅️ ลบแค่ความสูง appbar พอ (ไม่ต้องลบ 64px แล้ว) */
  overflow-y:auto;
  border-radius:0 0 var(--radius-lg) 0;
}
  }
  @media(min-width:1400px){
    .menu-grid{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="appbar">
    <div class="appbar-row">
      <div class="appbar-avatar">☕</div>
      <div>
        <div class="appbar-title">Café Amazon</div>
        <div class="appbar-sub">ตั๋วสั่งกาแฟ · งานประชุม</div>
      </div>
      <div class="appbar-date" id="todayLabel">-</div>
    </div>
  </div>

  <!-- ================= MENU VIEW ================= -->
  <div class="view active" id="view-menu">
    <div class="chips" id="catChips"></div>
    <div class="chips-spacer"></div>
    <div id="menuContainer"></div>
  </div>

  <!-- ================= CART VIEW (persistent panel on desktop) ================= -->
  <div class="view" id="view-cart">
    <div class="cartpanel-heading"><h3>ตั๋วที่กำลังสั่ง</h3><span id="cartCountLbl"></span></div>
    <div class="chatlog" id="chatlog"></div>
    <div id="cartList"></div>
    <div id="cartFooter"></div>
  </div>

  <!-- ================= SUMMARY VIEW ================= -->
  <div class="view" id="view-summary">
    <div class="subtabs">
      <div class="subtab active" data-mode="byMenu">สรุปสั่งร้าน</div>
      <div class="subtab" data-mode="byPerson">สรุปตามคนสั่ง</div>
    </div>
    <div id="summaryContent"></div>
  </div>

  <!-- Bottom nav -->
  <div class="bottomnav">
    <button class="navbtn active" data-view="menu">
      <span class="icon">☕</span><span class="lbl">สั่งเครื่องดื่ม</span>
    </button>
    <button class="navbtn navbtn-cart" data-view="cart">
      <span class="icon">🎫</span><span class="lbl">ตะกร้า</span>
      <span class="navbadge" id="cartBadge" style="display:none;">0</span>
    </button>
    <button class="navbtn" data-view="summary">
      <span class="icon">📋</span><span class="lbl">สรุปวันนี้</span>
    </button>
  </div>

</div>

<!-- Order modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet">
    <div class="modal-head">
      <div class="modal-icon" id="mIcon">☕</div>
      <div>
        <div class="modal-title" id="mName">-</div>
        <div class="modal-price" id="mPrice">-</div>
      </div>
    </div>

    <div class="field-label">ชื่อผู้สั่ง <span style="color:#9C4426">*</span></div>
    <input type="text" class="field-input" id="mOrderer" placeholder="พิมพ์ชื่อผู้สั่ง เช่น ผบ.ร้อย, จ่าสมชาย">

    <div class="field-label">ความหวาน</div>
    <div class="opt-row" id="mSweet"></div>

    <div class="field-label" id="mIceLabel">ระดับน้ำแข็ง</div>
    <div class="opt-row" id="mIce"></div>

    <div class="field-label">หมายเหตุ (ถ้ามี)</div>
    <input type="text" class="field-input" id="mNote" placeholder="เช่น ใส่ครีมเทียมเพิ่ม">

    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">ยกเลิก</button>
      <button class="btn btn-primary" id="mAdd">เพิ่มลงตะกร้า</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================== CONFIG ====================== */
// วาง URL ของ Google Apps Script Web App ที่ deploy แล้วตรงนี้
const GAS_URL = "https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXX/exec";

/* ====================== MENU DATA ====================== */
const MENU = [
  { cat:"กาแฟร้อน", icon:"☕", type:"hot", items:[
    {name:"เอสเปรสโซ่", price:45},
    {name:"อเมริกาโน่ร้อน", price:45},
    {name:"ลาเต้ร้อน", price:50},
    {name:"คาปูชิโน่ร้อน", price:50},
    {name:"มอคค่าร้อน", price:55},
  ]},
  { cat:"กาแฟเย็น", icon:"🧊", type:"cold", items:[
    {name:"อเมริกาโน่เย็น", price:50},
    {name:"ลาเต้เย็น", price:55},
    {name:"คาปูชิโน่เย็น", price:55},
    {name:"มอคค่าเย็น", price:60},
    {name:"คาราเมลมัคคิอาโต้เย็น", price:60},
  ]},
  { cat:"กาแฟปั่น", icon:"🥤", type:"blend", items:[
    {name:"คาปูชิโน่ปั่น", price:65},
    {name:"มอคค่าปั่น", price:65},
    {name:"คาราเมลปั่น", price:65},
  ]},
  { cat:"ชา / โกโก้", icon:"🍵", type:"cold", items:[
    {name:"ชาไทยเย็น", price:45},
    {name:"ชาเขียวเย็น", price:45},
    {name:"ชาเขียวปั่น", price:60, type:"blend"},
    {name:"โกโก้เย็น", price:50},
    {name:"โกโก้ปั่น", price:60, type:"blend"},
  ]},
  { cat:"เครื่องดื่มอื่นๆ", icon:"🍊", type:"cold", items:[
    {name:"น้ำส้ม 100%", price:45},
    {name:"น้ำผึ้งมะนาว", price:45},
    {name:"สมูทตี้ผลไม้รวม", price:60, type:"blend"},
  ]},
];

const SWEET_OPTS = ["หวานปกติ","หวานน้อย","ไม่หวาน","หวานมาก"];
const ICE_OPTS = ["น้ำแข็งปกติ","น้ำแข็งน้อย","ไม่ใส่น้ำแข็ง"];

/* ====================== STATE ====================== */
let cart = [];          // ยังไม่ส่ง — each item has a unique localId
let chatEvents = [];    // ตั๋ว/ข้อความในตะกร้า — each carries the SAME localId as its cart item
let todayOrders = [];   // ข้อมูลที่ส่งไปแล้ว (จาก sheet)
let currentItem = null;
let currentSelSweet = SWEET_OPTS[0];
let currentSelIce = ICE_OPTS[0];
let suppressScrollSpy = false;

/* ====================== THAI DATE ====================== */
function thaiDateLabel(d){
  const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const be = d.getFullYear() + 543;
  return d.getDate() + " " + months[d.getMonth()] + " " + be;
}
document.getElementById('todayLabel').textContent = thaiDateLabel(new Date());

/* ====================== STICKY HEADER OFFSET ======================
   วัดความสูงจริงของ appbar แล้วตั้งค่าตัวแปร CSS --header-h
   เพื่อให้แถบหมวดหมู่ (chips) sticky ได้ถูกตำแหน่งเสมอ ไม่ว่าจะเปิดจากมือถือหรือคอมพิวเตอร์ */
function syncHeaderHeight(){
  const bar = document.querySelector('.appbar');
  if(!bar) return;
  const h = bar.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('load', syncHeaderHeight);
window.addEventListener('resize', syncHeaderHeight);
syncHeaderHeight();

/* ====================== RENDER MENU ====================== */
const catChipsEl = document.getElementById('catChips');
const menuContainerEl = document.getElementById('menuContainer');

function iconClassFor(type){
  if(type==="cold") return "cold";
  if(type==="blend") return "blend";
  return "";
}

function renderChips(){
  catChipsEl.innerHTML = MENU.map((c,i)=>
    `<div class="chip ${i===0?'active':''}" data-cat="${c.cat}">${c.icon} ${c.cat}</div>`
  ).join('');
  catChipsEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      const target = document.getElementById('sec-'+chip.dataset.cat);
      if(target){
        suppressScrollSpy = true;
        target.scrollIntoView({behavior:'smooth', block:'start'});
        clearTimeout(window.__spyTimer);
        window.__spyTimer = setTimeout(()=>{ suppressScrollSpy = false; }, 700);
      }
    });
  });
}

function renderMenu(){
  menuContainerEl.innerHTML = MENU.map(c=>`
    <div id="sec-${c.cat}">
      <div class="cat-heading">${c.icon} ${c.cat}</div>
      <div class="menu-grid">
        ${c.items.map(it=>{
          const t = it.type || c.type;
          return `<div class="menu-card" data-cat="${c.cat}" data-icon="${c.icon}" data-name="${it.name}" data-price="${it.price}" data-type="${t}">
            <div class="menu-icon ${iconClassFor(t)}">${c.icon}</div>
            <div class="menu-name">${it.name}</div>
            <div class="menu-price num">${it.price} บาท</div>
            <div class="menu-add">+ เพิ่ม</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');

  menuContainerEl.querySelectorAll('.menu-card').forEach(card=>{
    card.addEventListener('click', ()=>openModal({
      cat: card.dataset.cat, icon: card.dataset.icon, name: card.dataset.name,
      price: Number(card.dataset.price), type: card.dataset.type
    }));
  });

  setupScrollSpy();
}
renderChips();
renderMenu();

/* ====================== SCROLLSPY ====================== */
function setupScrollSpy(){
  if(!('IntersectionObserver' in window)) return;
  if(window.__catObserver) window.__catObserver.disconnect();

  const sections = MENU.map(c=>document.getElementById('sec-'+c.cat)).filter(Boolean);
  window.__catObserver = new IntersectionObserver((entries)=>{
    if(suppressScrollSpy) return;
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const cat = entry.target.id.replace('sec-','');
        document.querySelectorAll('.chip').forEach(c=>{
          c.classList.toggle('active', c.dataset.cat === cat);
        });
      }
    });
  }, { root:null, rootMargin:'-160px 0px -70% 0px', threshold:0 });

  sections.forEach(sec=>window.__catObserver.observe(sec));
}

/* ====================== MODAL ====================== */
const modalBackdrop = document.getElementById('modalBackdrop');
function openModal(item){
  currentItem = item;
  currentSelSweet = SWEET_OPTS[0];
  currentSelIce = ICE_OPTS[0];
  document.getElementById('mIcon').textContent = item.icon;
  document.getElementById('mName').textContent = item.name;
  document.getElementById('mPrice').textContent = item.price + " บาท";
  document.getElementById('mOrderer').value = "";
  document.getElementById('mNote').value = "";

  document.getElementById('mSweet').innerHTML = SWEET_OPTS.map((s,i)=>
    `<div class="opt-pill ${i===0?'sel':''}" data-val="${s}">${s}</div>`).join('');
  document.querySelectorAll('#mSweet .opt-pill').forEach(p=>p.addEventListener('click',()=>{
    document.querySelectorAll('#mSweet .opt-pill').forEach(x=>x.classList.remove('sel'));
    p.classList.add('sel'); currentSelSweet = p.dataset.val;
  }));

  const showIce = item.type === "cold";
  document.getElementById('mIceLabel').style.display = showIce ? 'block':'none';
  document.getElementById('mIce').style.display = showIce ? 'flex':'none';
  document.getElementById('mIce').innerHTML = ICE_OPTS.map((s,i)=>
    `<div class="opt-pill ${i===0?'sel':''}" data-val="${s}">${s}</div>`).join('');
  document.querySelectorAll('#mIce .opt-pill').forEach(p=>p.addEventListener('click',()=>{
    document.querySelectorAll('#mIce .opt-pill').forEach(x=>x.classList.remove('sel'));
    p.classList.add('sel'); currentSelIce = p.dataset.val;
  }));

  modalBackdrop.classList.add('open');
  setTimeout(()=>document.getElementById('mOrderer').focus(), 200);
}
function closeModal(){ modalBackdrop.classList.remove('open'); currentItem=null; }
document.getElementById('mCancel').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e)=>{ if(e.target===modalBackdrop) closeModal(); });

document.getElementById('mAdd').addEventListener('click', ()=>{
  const orderer = document.getElementById('mOrderer').value.trim();
  if(!orderer){
    showToast("กรอกชื่อผู้สั่งก่อนนะ");
    document.getElementById('mOrderer').focus();
    return;
  }
  const note = document.getElementById('mNote').value.trim();
  const localId = 'c'+Date.now()+Math.random().toString(36).slice(2,7);
  const entry = {
    localId, name: orderer, category: currentItem.cat, menu: currentItem.name,
    icon: currentItem.icon, sweet: currentSelSweet,
    ice: currentItem.type==="cold" ? currentSelIce : "-",
    price: currentItem.price, note: note
  };
  cart.push(entry);
  // ผูกตั๋ว/ข้อความเข้ากับ localId เดียวกับรายการในตะกร้า
  // เพื่อให้ลบรายการแล้วข้อความที่แสดงหายไปด้วย
  chatEvents.push({localId, who:orderer, text: buildOrderText(entry), time: nowTimeLabel()});
  renderCart();
  updateCartBadge();
  showToast(`เพิ่ม ${currentItem.name} ให้คุณ${orderer} แล้ว`);
  closeModal();
});

function buildOrderText(e){
  let parts = [`<b>${e.name}</b> สั่ง ${e.menu}`];
  if(e.sweet) parts.push(e.sweet);
  if(e.ice && e.ice!=="-") parts.push(e.ice);
  if(e.note) parts.push('("' + e.note + '")');
  return parts.join(' · ');
}
function nowTimeLabel(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ====================== TOAST ====================== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ====================== CART VIEW ====================== */
function renderCart(){
  const chatlogEl = document.getElementById('chatlog');
  const countLbl = document.getElementById('cartCountLbl');
  countLbl.textContent = cart.length > 0 ? cart.length + ' รายการ' : '';

  if(chatEvents.length===0){
    chatlogEl.innerHTML = `<div class="chatlog-empty">ยังไม่มีตั๋วในตะกร้า เลือกเมนูจากแท็บ "สั่งเครื่องดื่ม" ได้เลย</div>`;
  } else {
    chatlogEl.innerHTML = chatEvents.map(ev=>`
      <div class="bubble-row" data-id="${ev.localId}">
        <div class="bubble">${ev.text}</div>
        <div class="bubble-time">${ev.time}</div>
      </div>
    `).join('');
  }

  const listEl = document.getElementById('cartList');
  const footEl = document.getElementById('cartFooter');
  if(cart.length===0){
    listEl.innerHTML = '';
    footEl.innerHTML = '';
    return;
  }
  listEl.innerHTML = cart.map(it=>`
    <div class="cart-item" data-id="${it.localId}">
      <div class="ci-icon">${it.icon}</div>
      <div class="ci-info">
        <div class="ci-name">${it.menu} — คุณ${it.name}</div>
        <div class="ci-meta">${it.sweet}${it.ice!=='-'?(' · '+it.ice):''}${it.note?(' · '+it.note):''}</div>
      </div>
      <div class="ci-price num">${it.price}฿</div>
      <button class="ci-del" data-id="${it.localId}">✕</button>
    </div>
  `).join('');
  listEl.querySelectorAll('.ci-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      // ลบทั้งรายการในตะกร้า และตั๋ว/ข้อความที่ผูกกับรายการนั้น (localId เดียวกัน)
      cart = cart.filter(c=>c.localId !== id);
      chatEvents = chatEvents.filter(ev=>ev.localId !== id);
      renderCart(); updateCartBadge();
    });
  });

  const total = cart.reduce((s,i)=>s+i.price,0);
  footEl.innerHTML = `
    <div class="cart-summary-bar"><span>รวม ${cart.length} แก้ว</span><span class="num">${total} บาท</span></div>
    <button class="btn btn-primary" id="submitCartBtn">ยืนยันสั่งซื้อ (${cart.length} แก้ว)</button>
  `;
  document.getElementById('submitCartBtn').addEventListener('click', submitCart);
}

function updateCartBadge(){
  const badge = document.getElementById('cartBadge');
  if(cart.length>0){ badge.style.display='flex'; badge.textContent = cart.length; }
  else { badge.style.display='none'; }
}

async function submitCart(){
  if(cart.length===0) return;
  const btn = document.getElementById('submitCartBtn');
  btn.disabled = true; btn.textContent = 'กำลังส่งคำสั่งซื้อ...';
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'addItems', items: cart })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'unknown error');
    showToast(`ส่งคำสั่งซื้อ ${cart.length} แก้วเรียบร้อย ✅`);
    cart = []; chatEvents = [];
    renderCart(); updateCartBadge();
    await loadToday();
    switchView('summary');
  }catch(err){
    showToast('ส่งคำสั่งซื้อไม่สำเร็จ ลองใหม่อีกครั้ง');
    console.error(err);
  }finally{
    btn.disabled = false;
  }
}

/* ====================== SUMMARY VIEW ====================== */
let summaryMode = 'byMenu';
document.querySelectorAll('.subtab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.subtab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    summaryMode = tab.dataset.mode;
    renderSummary();
  });
});

async function loadToday(){
  try{
    const res = await fetch(GAS_URL + '?action=getByDate');
    const data = await res.json();
    if(data.ok){ todayOrders = data.orders; }
  }catch(err){ console.error(err); }
  renderSummary();
}

function renderSummary(){
  const el = document.getElementById('summaryContent');
  if(todayOrders.length===0){
    el.innerHTML = `<div class="empty-state">
      <div class="big">📋</div>
      <div class="t">ยังไม่มีคนสั่งเครื่องดื่มวันนี้</div>
      <div>เริ่มสั่งได้จากแท็บ "สั่งเครื่องดื่ม"</div>
    </div>`;
    return;
  }

  const total = todayOrders.reduce((s,o)=>s+Number(o.price),0);
  let rowsHtml = '';

  if(summaryMode === 'byMenu'){
    const groups = {};
    todayOrders.forEach(o=>{
      const key = [o.menu, o.sweet, o.ice].join('|');
      if(!groups[key]) groups[key] = {menu:o.menu, sweet:o.sweet, ice:o.ice, qty:0, sum:0};
      groups[key].qty++; groups[key].sum += Number(o.price);
    });
    rowsHtml = Object.values(groups).map(g=>`
      <div class="receipt-row">
        <div class="rr-left">
          <div class="rr-name">${g.menu} × ${g.qty}</div>
          <div class="rr-meta">${g.sweet}${g.ice!=='-'?(' · '+g.ice):''}</div>
        </div>
        <div class="rr-price">${g.sum}฿</div>
      </div>
    `).join('');
  } else {
    const groups = {};
    todayOrders.forEach(o=>{
      if(!groups[o.name]) groups[o.name] = {name:o.name, items:[], sum:0};
      groups[o.name].items.push(o);
      groups[o.name].sum += Number(o.price);
    });
    rowsHtml = Object.values(groups).map(g=>`
      <div class="receipt-row">
        <div class="rr-left">
          <div class="rr-name">คุณ${g.name}</div>
          <div class="rr-meta">${g.items.map(i=>i.menu+(i.sweet?' ('+i.sweet+')':'')).join(', ')}</div>
        </div>
        <div class="rr-price">${g.sum}฿</div>
      </div>
    `).join('');
  }

  el.innerHTML = `
    <div class="receipt-wrap">
      <div class="receipt" id="receiptCapture">
        <div class="receipt-top">
          <h3>☕ Café Amazon — สรุปวันนี้</h3>
          <div class="sub">${thaiDateLabel(new Date())} · ${todayOrders.length} แก้ว</div>
        </div>
        <div class="perf-edge light"></div>
        <div class="receipt-body">${rowsHtml}</div>
        <div class="receipt-total"><span>รวมทั้งหมด</span><span class="num">${total} บาท</span></div>
        <div class="receipt-foot">ใช้รูปนี้อ้างอิงตอนสั่งที่ร้าน Café Amazon</div>
      </div>
    </div>
    <div class="save-btn-row">
      <button class="btn btn-secondary" id="refreshBtn">🔄 รีเฟรช</button>
      <button class="btn btn-primary" id="saveImgBtn">📷 บันทึกเป็นรูปภาพ</button>
    </div>
  `;
  document.getElementById('refreshBtn').addEventListener('click', loadToday);
  document.getElementById('saveImgBtn').addEventListener('click', saveReceiptImage);
}

async function saveReceiptImage(){
  const node = document.getElementById('receiptCapture');
  showToast('กำลังสร้างรูปภาพ...');
  try{
    const canvas = await html2canvas(node, {scale:2, backgroundColor:'#fffdf6'});
    const link = document.createElement('a');
    const fname = 'coffee-order-' + new Date().toISOString().slice(0,10) + '.png';
    link.download = fname;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('บันทึกรูปภาพแล้ว ✅');
  }catch(err){
    console.error(err);
    showToast('บันทึกรูปไม่สำเร็จ');
  }
}

/* ====================== NAV ====================== */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='summary') loadToday();
}
document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>switchView(btn.dataset.view));
});

/* ====================== INIT ====================== */
renderCart();
updateCartBadge();
loadToday();
</script>
</body>
</html>
