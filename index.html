<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ตั๋วกาแฟ Café Amazon | ประชุม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* ============================================================
     TOKEN SYSTEM — "late-night coffee counter, meeting-room edition"
     navy = the briefing room, coral = the order ticket stamped on top
     ============================================================ */
  :root{
    --navy-1:#122B38;
    --navy-2:#1E4256;
    --navy-3:#2A5670;
    --coral:#EA6C42;
    --coral-deep:#C94F27;
    --coral-tint:#FBE3D6;
    --cream:#F6F1E6;
    --paper:#FFFFFF;
    --ink:#1B2A31;
    --muted:#7C8C93;
    --line:#E9E0CC;
    --sky-tint:#E3EEF3;
    --sky:#3E7B92;
    --shadow-soft:0 10px 28px rgba(18,43,56,0.10);
    --shadow-card:0 4px 14px rgba(18,43,56,0.08);
    --shadow-pop:0 16px 34px rgba(18,43,56,0.20);
    --radius-xl:26px;
    --radius-lg:20px;
    --radius-md:15px;
    --radius-sm:10px;
    --ease:cubic-bezier(.32,.72,.14,1);
    --header-h:150px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Thai','Prompt',sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(30,66,86,0.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(234,108,66,0.10), transparent 45%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Prompt',sans-serif;}
  .num{font-family:'IBM Plex Mono',monospace;}

  /* ================= APP SHELL ================= */
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    box-shadow:var(--shadow-soft);
    display:flex;
    flex-direction:column;
  }
  @media(min-width:560px) and (max-width:1023px){
    body{padding:30px 12px;}
    #app{min-height:calc(100vh - 60px); border-radius:32px; overflow:hidden;}
  }

  /* ---------- Header (navy briefing card) ---------- */
  .appbar{
    background:linear-gradient(150deg,var(--navy-1),var(--navy-2) 70%,var(--navy-3));
    color:#fff;
    padding:calc(20px + env(safe-area-inset-top)) 20px 26px;
    border-radius:0 0 30px 30px;
    position:sticky; top:0; z-index:30;
    box-shadow:0 12px 24px rgba(18,43,56,0.22);
  }
  .appbar-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:#9FC1CF; margin-bottom:4px;}
  .appbar-row{display:flex; align-items:center; gap:13px;}
  .appbar-avatar{
    width:48px;height:48px;border-radius:16px;
    background:linear-gradient(160deg,var(--coral),var(--coral-deep));
    display:flex;align-items:center;justify-content:center;
    font-size:22px; flex-shrink:0;
    box-shadow:0 6px 14px rgba(201,79,39,0.4);
  }
  .appbar-title{font-weight:700; font-size:19px; line-height:1.2; letter-spacing:.1px;}
  .appbar-sub{font-size:12px; opacity:0.75; margin-top:3px;}
  .appbar-date{
    margin-left:auto; font-size:11px; background:rgba(255,255,255,0.12);
    padding:7px 13px; border-radius:100px; white-space:nowrap;
    font-family:'IBM Plex Mono',monospace; border:1px solid rgba(255,255,255,0.16);
    flex-shrink:0;
  }

  /* ---------- Category chips ---------- */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:4px 2px 2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chips-wrap{
    position:sticky; top:var(--header-h); z-index:20;
    background:linear-gradient(var(--cream) 78%, rgba(246,241,230,0));
    padding:12px 16px 10px;
    margin:0 -16px;
  }
  .chip{
    flex-shrink:0; padding:9px 16px; border-radius:100px; font-size:12.5px;
    background:var(--paper); border:1px solid var(--line); color:var(--navy-2);
    font-weight:600; cursor:pointer; transition:.22s var(--ease);
    display:flex; align-items:center; gap:6px;
  }
  .chip.active{background:var(--coral); border-color:var(--coral); color:#fff; box-shadow:0 6px 14px rgba(234,108,66,0.35);}

  /* ---------- Views ---------- */
  .view{display:none; padding:0 16px 14px; padding-bottom:calc(72px + 60px); flex:1;}
  .view.active{display:block;}

  /* ---------- Category banner ---------- */
  .cat-banner{display:flex; align-items:center; gap:10px; margin:18px 2px 12px;}
  .cat-banner .dot{width:8px;height:8px;border-radius:3px;background:var(--coral);}
  .cat-banner h2{margin:0; font-size:16px; font-weight:700; color:var(--navy-1);}
  .cat-banner .count{margin-left:auto; font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}

  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:13px;}
  .menu-card{
    background:var(--paper);
    border-radius:var(--radius-lg);
    padding:10px 10px 12px;
    box-shadow:var(--shadow-card);
    display:flex; flex-direction:column; gap:8px;
    cursor:pointer; transition:transform .18s var(--ease), box-shadow .18s var(--ease);
    position:relative;
  }
  .menu-card:hover{box-shadow:var(--shadow-pop); transform:translateY(-3px);}
  .menu-card:active{transform:scale(0.96);}
  .menu-photo{
    width:100%; aspect-ratio:1/0.82; border-radius:var(--radius-md); overflow:hidden;
    background:linear-gradient(160deg,var(--sky-tint),#EAF3F1);
    display:flex; align-items:center; justify-content:center; font-size:34px; position:relative;
  }
  .menu-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .menu-photo.hot{background:linear-gradient(160deg,#F2E4D8,var(--coral-tint));}
  .menu-photo.blend{background:linear-gradient(160deg,#EAF2E9,#DCEBDD);}
  .menu-name{font-size:13px; font-weight:600; line-height:1.3; padding:0 2px;}
  .menu-price{font-size:12.5px; color:var(--navy-2); font-weight:700; padding:0 2px; font-family:'IBM Plex Mono',monospace;}
  .menu-add{
    position:absolute; right:8px; bottom:8px;
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(160deg,var(--coral),var(--coral-deep));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:700; box-shadow:0 6px 14px rgba(201,79,39,0.38);
  }

  .menu-skeleton{display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:18px;}
  .sk-card{background:var(--paper); border-radius:var(--radius-lg); padding:10px; box-shadow:var(--shadow-card);}
  .sk-photo{aspect-ratio:1/0.82; border-radius:var(--radius-md); background:linear-gradient(90deg,#EFE8D6,#F7F2E5,#EFE8D6); background-size:200% 100%; animation:shimmer 1.3s infinite;}
  .sk-line{height:9px; border-radius:5px; margin-top:9px; background:linear-gradient(90deg,#EFE8D6,#F7F2E5,#EFE8D6); background-size:200% 100%; animation:shimmer 1.3s infinite;}
  .sk-line.w60{width:60%;}
  @keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

  .menu-error{
    text-align:center; padding:32px 18px; color:var(--muted); font-size:12.5px;
    background:var(--paper); border-radius:var(--radius-lg); margin-top:16px; border:1.5px dashed var(--line);
  }

  /* ---------- Cart panel heading ---------- */
  .cartpanel-heading{display:flex; align-items:center; justify-content:space-between; margin:18px 2px 12px;}
  .cartpanel-heading h3{font-size:15.5px; margin:0; color:var(--navy-1); font-weight:700; display:flex; align-items:center; gap:7px;}
  .cartpanel-heading span{font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; background:var(--coral-tint); padding:4px 10px; border-radius:100px;}

  .chatlog{margin-bottom:16px; display:flex; flex-direction:column; gap:8px;}
  .chatlog-empty{
    text-align:center; color:var(--muted); font-size:12.5px;
    padding:24px 14px; background:var(--paper); border:1.5px dashed var(--line);
    border-radius:var(--radius-lg);
  }
  .bubble-row{display:flex; flex-direction:column; align-items:flex-start;}
  .bubble{
    background:var(--paper); color:var(--ink); padding:10px 14px;
    border-radius:4px var(--radius-sm) var(--radius-sm) var(--radius-sm);
    font-size:12.8px; max-width:92%; line-height:1.5;
    border-left:3px solid var(--coral);
    box-shadow:var(--shadow-card);
  }
  .bubble b{font-weight:700; color:var(--navy-1);}
  .bubble-time{font-size:10px; color:var(--muted); margin-top:3px; margin-left:2px; font-family:'IBM Plex Mono',monospace;}

  /* ---------- Cart items ---------- */
  .cart-item{
    display:flex; gap:10px; align-items:center; background:var(--paper); border-radius:var(--radius-lg);
    padding:10px 12px; margin-bottom:8px; border:1px solid var(--line);
  }
  .cart-item .ci-icon{
    width:38px;height:38px;border-radius:12px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;overflow:hidden;
  }
  .cart-item .ci-icon img{width:100%; height:100%; object-fit:cover;}
  .cart-item .ci-info{flex:1; min-width:0;}
  .ci-name{font-size:13px; font-weight:600;}
  .ci-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .ci-price{font-size:13px; font-weight:700; color:var(--navy-2); flex-shrink:0; font-family:'IBM Plex Mono',monospace;}
  .ci-del{
    background:none; border:none; color:var(--coral-deep); font-size:17px; cursor:pointer; padding:4px 6px; flex-shrink:0;
    border-radius:50%; transition:background .15s;
  }
  .ci-del:hover{background:var(--coral-tint);}
  .cart-empty{text-align:center; padding:40px 20px; color:var(--muted);}

  .cart-summary-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; margin-top:6px; border-top:1.5px dashed var(--line); font-weight:700;
  }
  .cart-summary-bar .num{color:var(--navy-1); font-size:16px;}

  .btn{
    display:block; width:100%; text-align:center; border:none; border-radius:100px;
    padding:14px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:'Prompt',sans-serif;
    transition:transform .15s var(--ease), opacity .15s var(--ease), box-shadow .15s;
    letter-spacing:.2px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral-deep)); color:#fff; box-shadow:0 10px 20px rgba(201,79,39,0.32);}
  .btn-primary:disabled{background:#C9BFA9; cursor:not-allowed; box-shadow:none;}
  .btn-secondary{background:var(--sky-tint); color:var(--navy-1);}
  .btn-outline{background:#fff; color:var(--navy-1); border:1.5px solid var(--navy-2);}

  /* ---------- Summary / receipt ---------- */
  .subtabs{display:flex; gap:8px; margin:18px 0 14px;}
  .subtab{flex:1; text-align:center; padding:9px; border-radius:100px; font-size:12.5px; font-weight:700; background:var(--paper); border:1px solid var(--line); cursor:pointer; color:var(--muted); transition:.2s var(--ease);}
  .subtab.active{background:var(--navy-1); color:#fff; border-color:var(--navy-1);}

  .receipt-wrap{padding:6px 0 18px;}
  .receipt{
    background:var(--paper); border-radius:var(--radius-xl); position:relative; overflow:hidden;
    box-shadow:var(--shadow-pop);
  }
  .receipt-top{
    background:linear-gradient(150deg,var(--navy-1),var(--navy-2) 80%);
    color:#fff; padding:22px 20px 18px; position:relative;
  }
  .receipt-top h3{margin:0; font-size:16.5px; font-family:'Prompt',sans-serif;}
  .receipt-top .sub{font-size:11.5px; opacity:0.78; margin-top:4px; font-family:'IBM Plex Mono',monospace;}
  .receipt-body{padding:8px 20px 4px;}
  .receipt-row{display:flex; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .receipt-row:last-child{border-bottom:none;}
  .rr-left{flex:1;}
  .rr-name{font-weight:600;}
  .rr-meta{font-size:11px; color:var(--muted); margin-top:2px;}
  .rr-price{font-weight:700; white-space:nowrap; font-family:'IBM Plex Mono',monospace; color:var(--navy-2);}
  .receipt-total{
    display:flex; justify-content:space-between; padding:16px 20px 22px; font-weight:700; font-size:15.5px;
    background:var(--coral-tint); margin-top:6px; font-family:'Prompt',sans-serif; color:var(--navy-1);
  }
  .receipt-total .num{font-family:'IBM Plex Mono',monospace;}
  .receipt-foot{text-align:center; font-size:10.5px; color:var(--muted); padding:10px 0 16px;}

  .empty-state{text-align:center; padding:52px 20px; color:var(--muted);}
  .empty-state .big{font-size:36px; margin-bottom:10px;}
  .empty-state .t{font-weight:700; color:var(--ink); margin-bottom:4px; font-size:14px; font-family:'Prompt',sans-serif;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:calc(100% - 32px); max-width:428px;
    display:flex; gap:2px; padding:8px 8px; z-index:40;
    background:rgba(18,43,56,0.94);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border-radius:26px;
    box-shadow:0 16px 34px rgba(18,43,56,0.32);
  }
  .navbtn{
    flex:1; text-align:center; padding:9px 4px 8px; background:none; border:none; cursor:pointer;
    color:rgba(255,255,255,0.55); font-family:'Prompt',sans-serif; position:relative;
    border-radius:18px; transition:background .22s var(--ease), color .22s var(--ease);
  }
  .navbtn .icon-wrap{
    width:30px; height:30px; border-radius:10px; margin:0 auto; display:flex; align-items:center; justify-content:center;
    transition:.22s var(--ease); font-size:16px;
  }
  .navbtn .lbl{font-size:10px; margin-top:3px; font-weight:600; display:block;}
  .navbtn.active{color:#fff;}
  .navbtn.active .icon-wrap{background:linear-gradient(160deg,var(--coral),var(--coral-deep)); box-shadow:0 6px 14px rgba(201,79,39,0.5); transform:translateY(-2px);}
  .navbadge{
    position:absolute; top:0px; right:calc(50% - 22px); background:var(--coral); color:#fff;
    font-size:9.5px; min-width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 3px;
    font-family:'IBM Plex Mono',monospace; border:2px solid var(--navy-1);
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,29,35,0.55); z-index:100;
    backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-backdrop.open{display:flex;}
  .modal-sheet{
    background:#fff; width:100%; max-width:460px; border-radius:28px 28px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
    animation:slideup .28s var(--ease);
  }
  @keyframes slideup{from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .modal-icon{width:54px;height:54px;border-radius:16px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;font-size:25px;overflow:hidden;}
  .modal-icon img{width:100%; height:100%; object-fit:cover;}
  .modal-title{font-size:16.5px; font-weight:700; font-family:'Prompt',sans-serif;}
  .modal-price{font-size:13px; color:var(--navy-2); font-weight:700; margin-top:2px; font-family:'IBM Plex Mono',monospace;}
  .field-label{font-size:12.5px; font-weight:700; margin:15px 0 6px; color:var(--ink);}
  .field-input{
    width:100%; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line);
    font-size:14px; font-family:inherit; background:#FAF6EA;
  }
  .field-input:focus{outline:none; border-color:var(--navy-2);}
  .opt-row{display:flex; gap:8px; flex-wrap:wrap;}
  .opt-pill{
    padding:8px 14px; border-radius:100px; border:1.5px solid var(--line); background:#fff;
    font-size:12.5px; cursor:pointer; color:var(--muted); font-weight:600; transition:.2s var(--ease);
  }
  .opt-pill.sel{background:var(--navy-1); border-color:var(--navy-1); color:#fff;}
  .modal-actions{display:flex; gap:10px; margin-top:22px;}

  .qty-stepper{
    display:flex; align-items:center; gap:14px; background:#FAF6EA;
    border:1.5px solid var(--line); border-radius:100px; padding:6px 8px; width:fit-content;
  }
  .qty-btn{
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:var(--navy-1); color:#fff; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center; transition:.15s var(--ease);
  }
  .qty-btn:active{transform:scale(0.9);}
  .qty-btn.dec{background:#fff; color:var(--navy-1); border:1.5px solid var(--navy-1);}
  .qty-val{min-width:30px; text-align:center; font-size:16px; font-weight:700; font-family:'IBM Plex Mono',monospace;}

  .ci-qty{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .ci-qty-btn{
    width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
    color:var(--navy-1); font-size:14px; font-weight:700; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:.15s var(--ease); flex-shrink:0;
  }
  .ci-qty-btn:active{transform:scale(0.88);}
  .ci-qty-val{min-width:16px; text-align:center; font-size:12.5px; font-weight:700; font-family:'IBM Plex Mono',monospace;}

  .toast{
    position:fixed; bottom:calc(64px + 44px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--navy-1); color:#fff; padding:10px 18px; border-radius:100px;
    font-size:12.5px; z-index:200; opacity:0; pointer-events:none; transition:.28s var(--ease);
    white-space:nowrap; box-shadow:0 10px 24px rgba(18,43,56,0.35);
  }
  .toast.show{opacity:1; bottom:calc(64px + 54px + env(safe-area-inset-bottom));}

  .save-btn-row{display:flex; gap:10px; padding:0 0 14px;}

  ::-webkit-scrollbar{width:0; height:0;}

  /* ================= DESKTOP WEBAPP LAYOUT ================= */
  @media(min-width:1024px){
    body{padding:32px 20px;}
    #app{
      max-width:1160px;
      height:100vh;
      overflow-y:auto;
      overflow-x:hidden;
      display:grid;
      grid-template-columns:1fr 400px;
      grid-template-rows:auto 1fr;
      border-radius:32px;
      box-shadow:0 30px 70px rgba(18,43,56,0.24);
    }
    .appbar{grid-column:1/3; grid-row:1; padding:22px 30px 26px; border-radius:0 0 30px 30px;}
    .appbar-title{font-size:20px;}

    .view{grid-column:1; grid-row:2; padding:8px 30px 120px;}
    .chips-wrap{margin:0 0 4px; padding:12px 0 10px; position:sticky; top:var(--header-h);}
    .menu-grid{grid-template-columns:repeat(3,1fr); gap:16px;}
    .menu-skeleton{grid-template-columns:repeat(3,1fr);}

    #view-cart{
      display:flex !important; flex-direction:column;
      grid-column:2; grid-row:2;
      padding:22px 22px calc(20px + env(safe-area-inset-bottom));
      background:#fff;
      border-left:1px solid var(--line);
      position:sticky; top:0; align-self:start;
      height:calc(100vh - var(--header-h));
      overflow-y:auto;
    }
  }
  @media(min-width:1400px){
    .menu-grid{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="appbar">
    <div class="appbar-eyebrow">Order Ticket · Meeting</div>
    <div class="appbar-row">
      <div class="appbar-avatar">☕</div>
      <div>
        <div class="appbar-title">Café Amazon</div>
        <div class="appbar-sub">ตั๋วสั่งกาแฟสำหรับงานประชุม</div>
      </div>
      <div class="appbar-date" id="todayLabel">-</div>
    </div>
  </div>

  <!-- ================= MENU VIEW ================= -->
  <div class="view active" id="view-menu">
    <div class="chips-wrap"><div class="chips" id="catChips"></div></div>
    <div id="menuContainer"></div>
  </div>

  <!-- ================= CART VIEW (persistent panel on desktop) ================= -->
  <div class="view" id="view-cart">
    <div class="cartpanel-heading"><h3>🎫 ตั๋วที่กำลังสั่ง</h3><span id="cartCountLbl"></span></div>
    <div class="chatlog" id="chatlog"></div>
    <div id="cartList"></div>
    <div id="cartFooter"></div>
  </div>

  <!-- ================= SUMMARY VIEW ================= -->
  <div class="view" id="view-summary">
    <div class="subtabs">
      <div class="subtab active" data-mode="byMenu">สรุปสั่งร้าน</div>
      <div class="subtab" data-mode="byPerson">สรุปตามคนสั่ง</div>
    </div>
    <div id="summaryContent"></div>
  </div>

  <!-- ================= HISTORY VIEW ================= -->
  <div class="view" id="view-history">
    <div id="historyDateList"></div>
    <div id="historyContent"></div>
  </div>

  <!-- Bottom nav -->
  <div class="bottomnav">
    <button class="navbtn active" data-view="menu">
      <span class="icon-wrap">☕</span><span class="lbl">สั่งเครื่องดื่ม</span>
    </button>
    <button class="navbtn navbtn-cart" data-view="cart">
      <span class="icon-wrap">🎫</span><span class="lbl">ตะกร้า</span>
      <span class="navbadge" id="cartBadge" style="display:none;">0</span>
    </button>
    <button class="navbtn" data-view="summary">
      <span class="icon-wrap">📋</span><span class="lbl">สรุปวันนี้</span>
    </button>
    <button class="navbtn" data-view="history">
      <span class="icon-wrap">🗓️</span><span class="lbl">ย้อนหลัง</span>
    </button>
  </div>

</div>

<!-- Order modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet">
    <div class="modal-head">
      <div class="modal-icon" id="mIcon">☕</div>
      <div>
        <div class="modal-title" id="mName">-</div>
        <div class="modal-price" id="mPrice">-</div>
      </div>
    </div>

    <div class="field-label">ชื่อผู้สั่ง <span style="color:var(--coral-deep)">*</span></div>
    <input type="text" class="field-input" id="mOrderer" placeholder="พิมพ์ชื่อผู้สั่ง เช่น ส.ต.อ.ฉัตรชัย">

    <div class="field-label">จำนวน (แก้ว)</div>
    <div class="qty-stepper">
      <button type="button" class="qty-btn dec" id="mQtyDec">−</button>
      <span class="qty-val" id="mQtyVal">1</span>
      <button type="button" class="qty-btn" id="mQtyInc">+</button>
    </div>

    <div class="field-label">ความหวาน</div>
    <div class="opt-row" id="mSweet"></div>

    <div class="field-label" id="mIceLabel">ระดับน้ำแข็ง</div>
    <div class="opt-row" id="mIce"></div>

    <div class="field-label">หมายเหตุ (ถ้ามี)</div>
    <input type="text" class="field-input" id="mNote" placeholder="เช่น ใส่ครีมเทียมเพิ่ม">

    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">ยกเลิก</button>
      <button class="btn btn-primary" id="mAdd">เพิ่มลงตะกร้า</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================== CONFIG ====================== */
// วาง URL ของ Google Apps Script Web App ที่ deploy แล้วตรงนี้
const GAS_URL = "https://script.google.com/macros/s/AKfycbybVsRQyto-dZSDVl5UBOWpfJxYZViM_JXYyj3_qxl7L-MJC--2TduI3IL0TdrrAivBew/exec";

/* ====================== MENU DATA (โหลดจากชีต Menu ผ่าน GAS) ====================== */
// รูปแบบ: [{ cat, icon, items:[{name, price, image, type, icon}] }]
let MENU = [];
let menuLoaded = false;
let menuLoadFailed = false;

const SWEET_OPTS = ["หวานปกติ","หวานน้อย","ไม่หวาน","หวานมาก"];
const ICE_OPTS = ["น้ำแข็งปกติ","น้ำแข็งน้อย","ไม่ใส่น้ำแข็ง"];

/* ====================== STATE ====================== */
let cart = [];          // ยังไม่ส่ง — each item has a unique localId
let chatEvents = [];    // ตั๋ว/ข้อความในตะกร้า — each carries the SAME localId as its cart item
let todayOrders = [];   // ข้อมูลที่ส่งไปแล้ว (จาก sheet)
let currentItem = null;
let currentSelSweet = SWEET_OPTS[0];
let currentSelIce = ICE_OPTS[0];
let currentQty = 1;
const MAX_QTY = 20;
let suppressScrollSpy = false;

/* ====================== THAI DATE ====================== */
function thaiDateLabel(d){
  const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const be = d.getFullYear() + 543;
  return d.getDate() + " " + months[d.getMonth()] + " " + be;
}
document.getElementById('todayLabel').textContent = thaiDateLabel(new Date());

/* ====================== STICKY HEADER OFFSET ====================== */
function syncHeaderHeight(){
  const bar = document.querySelector('.appbar');
  if(!bar) return;
  const h = bar.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('load', syncHeaderHeight);
window.addEventListener('resize', syncHeaderHeight);
syncHeaderHeight();

/* ====================== LOAD MENU FROM SHEET ====================== */
const menuContainerEl = document.getElementById('menuContainer');
const catChipsEl = document.getElementById('catChips');

function renderMenuSkeleton(){
  menuContainerEl.innerHTML = `
    <div class="menu-skeleton">
      ${Array.from({length:6}).map(()=>`
        <div class="sk-card">
          <div class="sk-photo"></div>
          <div class="sk-line" style="width:85%"></div>
          <div class="sk-line w60"></div>
        </div>
      `).join('')}
    </div>`;
}

async function loadMenu(){
  renderMenuSkeleton();
  try{
    const res = await fetch(GAS_URL + '?action=getMenu');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'load menu failed');
    MENU = data.categories || [];
    menuLoaded = true;
    menuLoadFailed = false;
  }catch(err){
    console.error(err);
    menuLoadFailed = true;
    MENU = [];
  }
  renderChips();
  renderMenu();
}

/* ====================== RENDER MENU ====================== */
function iconClassFor(type){
  if(type==="cold") return "";
  if(type==="blend") return "blend";
  return "hot";
}

function renderChips(){
  if(MENU.length === 0){ catChipsEl.innerHTML = ''; return; }
  catChipsEl.innerHTML = MENU.map((c,i)=>
    `<div class="chip ${i===0?'active':''}" data-cat="${c.cat}">${c.icon} ${c.cat}</div>`
  ).join('');
  catChipsEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      const target = document.getElementById('sec-'+chip.dataset.cat);
      if(target){
        suppressScrollSpy = true;
        target.scrollIntoView({behavior:'smooth', block:'start'});
        clearTimeout(window.__spyTimer);
        window.__spyTimer = setTimeout(()=>{ suppressScrollSpy = false; }, 700);
      }
    });
  });
}

function renderMenu(){
  if(menuLoadFailed){
    menuContainerEl.innerHTML = `<div class="menu-error">โหลดเมนูไม่สำเร็จ ตรวจสอบการเชื่อมต่อ แล้วลองใหม่<br><br>
      <button class="btn btn-secondary" id="retryMenuBtn" style="margin-top:8px;">🔄 ลองใหม่</button></div>`;
    document.getElementById('retryMenuBtn').addEventListener('click', loadMenu);
    return;
  }
  if(MENU.length === 0){
    menuContainerEl.innerHTML = `<div class="menu-error">ยังไม่มีเมนูในระบบ กรุณาเพิ่มเมนูในชีต "Menu"</div>`;
    return;
  }

  menuContainerEl.innerHTML = MENU.map(c=>{
    const banner = `
      <div class="cat-banner">
        <span class="dot"></span>
        <h2>${c.icon} ${c.cat}</h2>
        <span class="count">${c.items.length} เมนู</span>
      </div>`;
    return `
    <div id="sec-${c.cat}">
      ${banner}
      <div class="menu-grid">
        ${c.items.map(it=>{
          const t = it.type || 'hot';
          const photo = it.image
            ? `<img src="${it.image}" alt="${it.name}" loading="lazy" onerror="this.parentElement.innerHTML='${it.icon || c.icon}'; this.parentElement.classList.add('${iconClassFor(t)}');">`
            : (it.icon || c.icon);
          const photoClass = it.image ? '' : iconClassFor(t);
          return `<div class="menu-card" data-cat="${c.cat}" data-icon="${it.icon || c.icon}" data-name="${it.name}" data-price="${it.price}" data-type="${t}" data-image="${it.image || ''}">
            <div class="menu-photo ${photoClass}">${photo}</div>
            <div class="menu-name">${it.name}</div>
            <div class="menu-price num">${it.price} บาท</div>
            <div class="menu-add">+</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
  }).join('');

  menuContainerEl.querySelectorAll('.menu-card').forEach(card=>{
    card.addEventListener('click', ()=>openModal({
      cat: card.dataset.cat, icon: card.dataset.icon, name: card.dataset.name,
      price: Number(card.dataset.price), type: card.dataset.type, image: card.dataset.image
    }));
  });

  setupScrollSpy();
}

/* ====================== SCROLLSPY ====================== */
function setupScrollSpy(){
  if(!('IntersectionObserver' in window)) return;
  if(window.__catObserver) window.__catObserver.disconnect();

  const sections = MENU.map(c=>document.getElementById('sec-'+c.cat)).filter(Boolean);
  window.__catObserver = new IntersectionObserver((entries)=>{
    if(suppressScrollSpy) return;
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const cat = entry.target.id.replace('sec-','');
        document.querySelectorAll('.chip').forEach(c=>{
          c.classList.toggle('active', c.dataset.cat === cat);
        });
      }
    });
  }, { root:null, rootMargin:'-160px 0px -70% 0px', threshold:0 });

  sections.forEach(sec=>window.__catObserver.observe(sec));
}

/* ====================== MODAL ====================== */
const modalBackdrop = document.getElementById('modalBackdrop');
function openModal(item){
  currentItem = item;
  currentSelSweet = SWEET_OPTS[0];
  currentSelIce = ICE_OPTS[0];
  currentQty = 1;
  const iconEl = document.getElementById('mIcon');
  iconEl.innerHTML = item.image ? `<img src="${item.image}" alt="${item.name}" onerror="this.parentElement.textContent='${item.icon}';">` : item.icon;
  document.getElementById('mName').textContent = item.name;
  document.getElementById('mPrice').textContent = item.price + " บาท";
  document.getElementById('mOrderer').value = "";
  document.getElementById('mNote').value = "";
  document.getElementById('mQtyVal').textContent = currentQty;

  document.getElementById('mSweet').innerHTML = SWEET_OPTS.map((s,i)=>
    `<div class="opt-pill ${i===0?'sel':''}" data-val="${s}">${s}</div>`).join('');
  document.querySelectorAll('#mSweet .opt-pill').forEach(p=>p.addEventListener('click',()=>{
    document.querySelectorAll('#mSweet .opt-pill').forEach(x=>x.classList.remove('sel'));
    p.classList.add('sel'); currentSelSweet = p.dataset.val;
  }));

  const showIce = item.type === "cold";
  document.getElementById('mIceLabel').style.display = showIce ? 'block':'none';
  document.getElementById('mIce').style.display = showIce ? 'flex':'none';
  document.getElementById('mIce').innerHTML = ICE_OPTS.map((s,i)=>
    `<div class="opt-pill ${i===0?'sel':''}" data-val="${s}">${s}</div>`).join('');
  document.querySelectorAll('#mIce .opt-pill').forEach(p=>p.addEventListener('click',()=>{
    document.querySelectorAll('#mIce .opt-pill').forEach(x=>x.classList.remove('sel'));
    p.classList.add('sel'); currentSelIce = p.dataset.val;
  }));

  modalBackdrop.classList.add('open');
  setTimeout(()=>document.getElementById('mOrderer').focus(), 200);
}
function closeModal(){ modalBackdrop.classList.remove('open'); currentItem=null; }
document.getElementById('mCancel').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e)=>{ if(e.target===modalBackdrop) closeModal(); });

document.getElementById('mQtyDec').addEventListener('click', ()=>{
  if(currentQty <= 1) return;
  currentQty--;
  document.getElementById('mQtyVal').textContent = currentQty;
});
document.getElementById('mQtyInc').addEventListener('click', ()=>{
  if(currentQty >= MAX_QTY) return;
  currentQty++;
  document.getElementById('mQtyVal').textContent = currentQty;
});

document.getElementById('mAdd').addEventListener('click', ()=>{
  const orderer = document.getElementById('mOrderer').value.trim();
  if(!orderer){
    showToast("กรอกชื่อผู้สั่งก่อนนะ");
    document.getElementById('mOrderer').focus();
    return;
  }
  const note = document.getElementById('mNote').value.trim();
  const qty = currentQty;
  const localId = 'c'+Date.now()+Math.random().toString(36).slice(2,7);
  const entry = {
    localId, name: orderer, category: currentItem.cat, menu: currentItem.name,
    icon: currentItem.icon, image: currentItem.image, sweet: currentSelSweet,
    ice: currentItem.type==="cold" ? currentSelIce : "-",
    price: currentItem.price, note: note, qty: qty
  };
  cart.push(entry);
  // ผูกตั๋ว/ข้อความเข้ากับ localId เดียวกับรายการในตะกร้า
  // เพื่อให้ลบรายการแล้วข้อความที่แสดงหายไปด้วย
  chatEvents.push({localId, who:orderer, text: buildOrderText(entry), time: nowTimeLabel()});
  renderCart();
  updateCartBadge();
  showToast(`เพิ่ม ${currentItem.name}${qty>1?(' x'+qty):''} ให้คุณ${orderer} แล้ว`);
  closeModal();
});

function buildOrderText(e){
  const qtyTxt = (e.qty && e.qty>1) ? ` x${e.qty}` : '';
  let parts = [`<b>${e.name}</b> สั่ง ${e.menu}${qtyTxt}`];
  if(e.sweet) parts.push(e.sweet);
  if(e.ice && e.ice!=="-") parts.push(e.ice);
  if(e.note) parts.push('("' + e.note + '")');
  return parts.join(' · ');
}
function updateChatTextFor(localId){
  const it = cart.find(c=>c.localId===localId);
  const ev = chatEvents.find(c=>c.localId===localId);
  if(it && ev){ ev.text = buildOrderText(it); }
}
function nowTimeLabel(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ====================== TOAST ====================== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ====================== CART VIEW ====================== */
function cartTotalQty(){
  return cart.reduce((s,i)=>s+(i.qty||1),0);
}

function renderCart(){
  const chatlogEl = document.getElementById('chatlog');
  const countLbl = document.getElementById('cartCountLbl');
  const totalQty = cartTotalQty();
  countLbl.textContent = totalQty > 0 ? totalQty + ' แก้ว' : '';

  if(chatEvents.length===0){
    chatlogEl.innerHTML = `<div class="chatlog-empty">ยังไม่มีตั๋วในตะกร้า เลือกเมนูจากแท็บ "สั่งเครื่องดื่ม" ได้เลย</div>`;
  } else {
    chatlogEl.innerHTML = chatEvents.map(ev=>`
      <div class="bubble-row" data-id="${ev.localId}">
        <div class="bubble">${ev.text}</div>
        <div class="bubble-time">${ev.time}</div>
      </div>
    `).join('');
  }

  const listEl = document.getElementById('cartList');
  const footEl = document.getElementById('cartFooter');
  if(cart.length===0){
    listEl.innerHTML = '';
    footEl.innerHTML = '';
    return;
  }
  listEl.innerHTML = cart.map(it=>{
    const q = it.qty || 1;
    const iconInner = it.image ? `<img src="${it.image}" alt="${it.menu}" onerror="this.parentElement.textContent='${it.icon}';">` : it.icon;
    return `
    <div class="cart-item" data-id="${it.localId}">
      <div class="ci-icon">${iconInner}</div>
      <div class="ci-info">
        <div class="ci-name">${it.menu} — คุณ${it.name}</div>
        <div class="ci-meta">${it.sweet}${it.ice!=='-'?(' · '+it.ice):''}${it.note?(' · '+it.note):''}</div>
      </div>
      <div class="ci-qty">
        <button class="ci-qty-btn" data-act="dec" data-id="${it.localId}">−</button>
        <span class="ci-qty-val">${q}</span>
        <button class="ci-qty-btn" data-act="inc" data-id="${it.localId}">+</button>
      </div>
      <div class="ci-price num">${it.price*q}฿</div>
      <button class="ci-del" data-id="${it.localId}">✕</button>
    </div>
  `;
  }).join('');
  listEl.querySelectorAll('.ci-qty-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const it = cart.find(c=>c.localId===id);
      if(!it) return;
      const cur = it.qty || 1;
      if(btn.dataset.act === 'inc'){
        if(cur >= MAX_QTY) return;
        it.qty = cur + 1;
      } else {
        if(cur <= 1){
          // ลดจาก 1 แก้ว = เอารายการนี้ออกจากตะกร้าเลย
          cart = cart.filter(c=>c.localId !== id);
          chatEvents = chatEvents.filter(ev=>ev.localId !== id);
          renderCart(); updateCartBadge();
          return;
        }
        it.qty = cur - 1;
      }
      updateChatTextFor(id);
      renderCart(); updateCartBadge();
    });
  });
  listEl.querySelectorAll('.ci-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      // ลบทั้งรายการในตะกร้า และตั๋ว/ข้อความที่ผูกกับรายการนั้น (localId เดียวกัน)
      cart = cart.filter(c=>c.localId !== id);
      chatEvents = chatEvents.filter(ev=>ev.localId !== id);
      renderCart(); updateCartBadge();
    });
  });

  const total = cart.reduce((s,i)=>s+i.price*(i.qty||1),0);
  const totalQtyNow = cartTotalQty();
  footEl.innerHTML = `
    <div class="cart-summary-bar"><span>รวม ${totalQtyNow} แก้ว</span><span class="num">${total} บาท</span></div>
    <button class="btn btn-primary" id="submitCartBtn">ยืนยันสั่งซื้อ (${totalQtyNow} แก้ว)</button>
  `;
  document.getElementById('submitCartBtn').addEventListener('click', submitCart);
}

function updateCartBadge(){
  const badge = document.getElementById('cartBadge');
  const totalQty = cartTotalQty();
  if(totalQty>0){ badge.style.display='flex'; badge.textContent = totalQty; }
  else { badge.style.display='none'; }
}

function expandCartForBackend(){
  // แตกรายการที่มี qty > 1 ให้เป็นหนึ่งแถวต่อหนึ่งแก้ว
  // เพื่อให้รูปแบบข้อมูลที่ส่งไป backend เหมือนเดิมทุกประการ (ไม่ต้องแก้ฝั่ง GAS)
  const rows = [];
  cart.forEach(it=>{
    const q = it.qty || 1;
    for(let i=0;i<q;i++){
      rows.push({
        localId: it.localId + '-' + i,
        name: it.name, category: it.category, menu: it.menu,
        icon: it.icon, sweet: it.sweet, ice: it.ice, price: it.price, note: it.note
      });
    }
  });
  return rows;
}

async function submitCart(){
  if(cart.length===0) return;
  const btn = document.getElementById('submitCartBtn');
  const rows = expandCartForBackend();
  btn.disabled = true; btn.textContent = 'กำลังส่งคำสั่งซื้อ...';
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'addItems', items: rows })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'unknown error');
    showToast(`ส่งคำสั่งซื้อ ${rows.length} แก้วเรียบร้อย ✅`);
    cart = []; chatEvents = [];
    renderCart(); updateCartBadge();
    await loadToday();
    switchView('summary');
  }catch(err){
    showToast('ส่งคำสั่งซื้อไม่สำเร็จ ลองใหม่อีกครั้ง');
    console.error(err);
  }finally{
    btn.disabled = false;
  }
}

/* ====================== SUMMARY VIEW ====================== */
let summaryMode = 'byMenu';
document.querySelectorAll('.subtab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.subtab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    summaryMode = tab.dataset.mode;
    renderSummary();
  });
});

async function loadToday(){
  try{
    const res = await fetch(GAS_URL + '?action=getByDate');
    const data = await res.json();
    if(data.ok){ todayOrders = data.orders; }
  }catch(err){ console.error(err); }
  renderSummary();
}

function renderSummary(){
  const el = document.getElementById('summaryContent');
  if(todayOrders.length===0){
    el.innerHTML = `<div class="empty-state">
      <div class="big">📋</div>
      <div class="t">ยังไม่มีคนสั่งเครื่องดื่มวันนี้</div>
      <div>เริ่มสั่งได้จากแท็บ "สั่งเครื่องดื่ม"</div>
    </div>`;
    return;
  }

  const total = todayOrders.reduce((s,o)=>s+Number(o.price),0);
  let rowsHtml = '';

  if(summaryMode === 'byMenu'){
    const groups = {};
    todayOrders.forEach(o=>{
      const key = [o.menu, o.sweet, o.ice].join('|');
      if(!groups[key]) groups[key] = {menu:o.menu, sweet:o.sweet, ice:o.ice, qty:0, sum:0};
      groups[key].qty++; groups[key].sum += Number(o.price);
    });
    rowsHtml = Object.values(groups).map(g=>`
      <div class="receipt-row">
        <div class="rr-left">
          <div class="rr-name">${g.menu} × ${g.qty}</div>
          <div class="rr-meta">${g.sweet}${g.ice!=='-'?(' · '+g.ice):''}</div>
        </div>
        <div class="rr-price">${g.sum}฿</div>
      </div>
    `).join('');
  } else {
    const groups = {};
    todayOrders.forEach(o=>{
      if(!groups[o.name]) groups[o.name] = {name:o.name, items:[], sum:0};
      groups[o.name].items.push(o);
      groups[o.name].sum += Number(o.price);
    });
    rowsHtml = Object.values(groups).map(g=>`
      <div class="receipt-row">
        <div class="rr-left">
          <div class="rr-name">คุณ${g.name}</div>
          <div class="rr-meta">${g.items.map(i=>i.menu+(i.sweet?' ('+i.sweet+')':'')).join(', ')}</div>
        </div>
        <div class="rr-price">${g.sum}฿</div>
      </div>
    `).join('');
  }

  el.innerHTML = `
    <div class="receipt-wrap">
      <div class="receipt" id="receiptCapture">
        <div class="receipt-top">
          <h3>☕ Café Amazon — สรุปวันนี้</h3>
          <div class="sub">${thaiDateLabel(new Date())} · ${todayOrders.length} แก้ว</div>
        </div>
        <div class="receipt-body">${rowsHtml}</div>
        <div class="receipt-total"><span>รวมทั้งหมด</span><span class="num">${total} บาท</span></div>
        <div class="receipt-foot">ใช้รูปนี้อ้างอิงตอนสั่งที่ร้าน Café Amazon</div>
      </div>
    </div>
    <div class="save-btn-row">
      <button class="btn btn-secondary" id="refreshBtn">🔄 รีเฟรช</button>
      <button class="btn btn-primary" id="saveImgBtn">📷 บันทึกเป็นรูปภาพ</button>
    </div>
  `;
  document.getElementById('refreshBtn').addEventListener('click', loadToday);
  document.getElementById('saveImgBtn').addEventListener('click', saveReceiptImage);
}

/* ====================== HISTORY VIEW ====================== */
let historyDates = [];
let selectedHistoryDate = null;

async function loadHistoryDates(){
  const listEl = document.getElementById('historyDateList');
  listEl.innerHTML = `<div class="empty-state"><div>กำลังโหลด...</div></div>`;
  try{
    const res = await fetch(GAS_URL + '?action=getDates');
    const data = await res.json();
    if(data.ok){ historyDates = data.dates; }
  }catch(err){ console.error(err); }
  renderHistoryDateList();
}

function renderHistoryDateList(){
  const listEl = document.getElementById('historyDateList');
  const today = todayStr_();
  if(historyDates.length===0){
    listEl.innerHTML = `<div class="empty-state">
      <div class="big">🗓️</div>
      <div class="t">ยังไม่มีประวัติการสั่ง</div>
    </div>`;
    document.getElementById('historyContent').innerHTML = '';
    return;
  }
  listEl.innerHTML = `
    <div class="chips-wrap" style="position:static; margin:16px 0 0; padding:0;">
      <div class="chips">
        ${historyDates.map(d=>`<div class="chip hist-chip ${d===selectedHistoryDate?'active':''}" data-date="${d}">${thaiDateFromStr_(d)}${d===today?' (วันนี้)':''}</div>`).join('')}
      </div>
    </div>
  `;
  listEl.querySelectorAll('.hist-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      selectedHistoryDate = chip.dataset.date;
      renderHistoryDateList();
      loadHistoryOrders(selectedHistoryDate);
    });
  });
  if(!selectedHistoryDate && historyDates.length>0){
    selectedHistoryDate = historyDates[0];
    renderHistoryDateList();
    loadHistoryOrders(selectedHistoryDate);
  }
}

function todayStr_(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function thaiDateFromStr_(s){
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return thaiDateLabel(dt);
}

async function loadHistoryOrders(date){
  const contentEl = document.getElementById('historyContent');
  contentEl.innerHTML = `<div class="empty-state"><div>กำลังโหลด...</div></div>`;
  try{
    const res = await fetch(GAS_URL + '?action=getByDate&date=' + date);
    const data = await res.json();
    if(data.ok){ renderHistoryReceipt(date, data.orders); }
  }catch(err){
    console.error(err);
    contentEl.innerHTML = `<div class="empty-state"><div class="t">โหลดข้อมูลไม่สำเร็จ</div></div>`;
  }
}

function renderHistoryReceipt(date, orders){
  const contentEl = document.getElementById('historyContent');
  if(orders.length===0){
    contentEl.innerHTML = `<div class="empty-state">
      <div class="big">📋</div>
      <div class="t">ไม่มีออเดอร์ในวันนี้</div>
    </div>`;
    return;
  }
  const total = orders.reduce((s,o)=>s+Number(o.price),0);
  const groups = {};
  orders.forEach(o=>{
    const key = [o.menu, o.sweet, o.ice].join('|');
    if(!groups[key]) groups[key] = {menu:o.menu, sweet:o.sweet, ice:o.ice, qty:0, sum:0};
    groups[key].qty++; groups[key].sum += Number(o.price);
  });
  const rowsHtml = Object.values(groups).map(g=>`
    <div class="receipt-row">
      <div class="rr-left">
        <div class="rr-name">${g.menu} × ${g.qty}</div>
        <div class="rr-meta">${g.sweet}${g.ice!=='-'?(' · '+g.ice):''}</div>
      </div>
      <div class="rr-price">${g.sum}฿</div>
    </div>
  `).join('');

  contentEl.innerHTML = `
    <div class="receipt-wrap">
      <div class="receipt" id="historyReceiptCapture">
        <div class="receipt-top">
          <h3>☕ Café Amazon — สรุปย้อนหลัง</h3>
          <div class="sub">${thaiDateFromStr_(date)} · ${orders.length} แก้ว</div>
        </div>
        <div class="receipt-body">${rowsHtml}</div>
        <div class="receipt-total"><span>รวมทั้งหมด</span><span class="num">${total} บาท</span></div>
      </div>
    </div>
    <div class="save-btn-row">
      <button class="btn btn-primary" id="saveHistoryImgBtn">📷 บันทึกเป็นรูปภาพ</button>
    </div>
  `;
  document.getElementById('saveHistoryImgBtn').addEventListener('click', ()=>{
    saveReceiptImageEl_(document.getElementById('historyReceiptCapture'), 'coffee-history-'+date+'.png');
  });
}

async function saveReceiptImageEl_(node, fname){
  showToast('กำลังสร้างรูปภาพ...');
  try{
    const canvas = await html2canvas(node, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const link = document.createElement('a');
    link.download = fname;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('บันทึกรูปภาพแล้ว ✅');
  }catch(err){
    console.error(err);
    showToast('บันทึกรูปไม่สำเร็จ');
  }
}

async function saveReceiptImage(){
  const node = document.getElementById('receiptCapture');
  showToast('กำลังสร้างรูปภาพ...');
  try{
    const canvas = await html2canvas(node, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const link = document.createElement('a');
    const fname = 'coffee-order-' + new Date().toISOString().slice(0,10) + '.png';
    link.download = fname;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('บันทึกรูปภาพแล้ว ✅');
  }catch(err){
    console.error(err);
    showToast('บันทึกรูปไม่สำเร็จ');
  }
}

/* ====================== NAV ====================== */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='summary') loadToday();
  if(name==='history') loadHistoryDates();
}
document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>switchView(btn.dataset.view));
});

/* ====================== INIT ====================== */
renderCart();
updateCartBadge();
loadMenu();
loadToday();
</script>
